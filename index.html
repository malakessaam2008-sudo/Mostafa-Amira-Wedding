<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostafa & Amira Wedding</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f8f4ef;
      color: #3d342e;
      text-align: center;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background: #f8f4ef;
    }
    /* الصورة */
    .hero-image {
      width: 100%;
      max-width: 430px;
      height: 520px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 28px;
    }
    .small-text {
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 48px;
      font-weight: normal;
      margin-bottom: 12px;
    }
    .ampersand {
      font-size: 28px;
      font-style: italic;
      margin: 0 8px;
    }
    .date {
      font-size: 18px;
      letter-spacing: 3px;
      margin-bottom: 35px;
    }
    /* Countdown */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 35px;
    }
    .time-box {
      min-width: 65px;
    }
    .number {
      display: block;
      font-size: 27px;
      font-weight: bold;
    }
    .label {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    /* Location */
    .location {
      margin-top: 10px;
    }
    .location p {
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 18px;
    }
    .map-button {
      display: inline-block;
      text-decoration: none;
      color: white;
      background: #3d342e;
      padding: 13px 28px;
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .map-button:hover {
      opacity: 0.85;
    }
    @media (max-width: 500px) {
      h1 {
        font-size: 38px;
      }
      .hero-image {
        height: 450px;
      }
      .countdown {
        gap: 8px;
      }
      .time-box {
        min-width: 58px;
      }
      .number {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <!-- حطي صورتك هنا -->
    <img
      class="hero-image"
      src="wedding.jpg"
      alt="Mostafa and Amira Wedding"
    >
    <div class="small-text">
      Together with their families
    </div>
    <h1>
      Mostafa
      <span class="ampersand">&</span>
      Amira
    </h1>
    <div class="date">
      01 · 11 · 2026
    </div>
    <!-- Countdown -->
    <div class="countdown">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>
    <!-- Location -->
    <div class="location">
      <p>
        Al Masa Hotel<br>
        Zumorda Hall<br>
        Nasr City, Cairo
      </p>
      <a
        class="map-button"
        href="https://www.google.com/maps/search/?api=1&query=Al+Masa+Hotel+Nasr+City+Cairo"
        target="_blank"
      >
        📍 VIEW LOCATION
      </a>
    </div>
  </section>
  <script>
    // Wedding date
    const weddingDate = new Date("November 1, 2026 19:00:00").getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const difference = weddingDate - now;
      if (difference <= 0) {
        document.getElementById("days").innerHTML = "00";
        document.getElementById("hours").innerHTML = "00";
        document.getElementById("minutes").innerHTML = "00";
        document.getElementById("seconds").innerHTML = "00";
        return;
      }
      const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
      );
      const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
      );
      const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
      );
      const seconds = Math.floor(
        (difference / 1000) % 60
      );
      document.getElementById("days").innerHTML =
        String(days).padStart(2, "0");
      document.getElementById("hours").innerHTML =
        String(hours).padStart(2, "0");
      document.getElementById("minutes").innerHTML =
        String(minutes).padStart(2, "0");
      document.getElementById("seconds").innerHTML =
        String(seconds).padStart(2, "0");
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
